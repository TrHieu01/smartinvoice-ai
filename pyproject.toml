[project]
name = "smartinvoice-ai"
version = "0.2.0"
description = "SmartInvoice AI API, extraction pipeline and versioned contracts."
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.12.5",
  "fastapi==0.128.0",
  "uvicorn==0.40.0",
  "httpx==0.28.1",
  "pydantic-settings==2.12.0",
  "pymupdf==1.26.7",
  "pillow==11.3.0",
]

[project.optional-dependencies]
worker = [
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "runpod>=1.10.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "jsonschema==4.26.0",
  "openapi-spec-validator==0.7.2",
  "ruff==0.14.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
