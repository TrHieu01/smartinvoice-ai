name: Build experimental VLM worker image
on:
  workflow_dispatch:
    inputs:
      runtime_only:
        description: Reuse pinned verified model layers (unchanged dependencies only)
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  worker-vlm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Free space on disposable hosted runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune --all --force
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-worker-vlm" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.runtime_only && 'worker/Dockerfile.vlm-runtime' || 'worker/Dockerfile.vlm' }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: true
