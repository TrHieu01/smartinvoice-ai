services:
  - type: web
    name: smartinvoice-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        value: https://rnjamfgzckmgvvpuywgh.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DISPATCHER_URL
        value: https://rnjamfgzckmgvvpuywgh.supabase.co/functions/v1/dispatch-jobs
      - key: DISPATCHER_SECRET
        sync: false
